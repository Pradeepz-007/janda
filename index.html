<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090303">
  <title>JANDA</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090303;
      color: #f5e8e2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #b6a19a;
      --red: #b70d19;
      --ember: #ff4b22;
      --panel: rgba(10, 4, 5, .88);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, rgba(14, 3, 3, .48), rgba(24, 3, 3, .36) 48%, rgba(10, 2, 2, .74)),
        url("assets/ritual-background.png") center center / cover fixed no-repeat,
        #090303;
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      background-image: radial-gradient(rgba(255, 64, 42, .34) .8px, transparent .8px);
      background-size: 53px 53px;
      content: "";
      opacity: .11;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #ffe6d2;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgba(255, 86, 62, .58);
      border-radius: 50%;
      color: var(--red);
      font-size: 1rem;
    }

    main {
      display: flex;
      width: min(100%, 520px);
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding: 42px 0;
    }

    .intro { text-align: center; }

    .eyebrow {
      margin: 0 0 15px;
      color: var(--red);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.7rem, 9vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1;
    }

    h1 span {
      color: var(--ember);
      font-style: italic;
    }

    .subtitle {
      max-width: 370px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: .98rem;
      line-height: 1.65;
    }

    .spell-card {
      position: relative;
      margin-top: 38px;
      padding: 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 100, 68, .25);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .035);
      backdrop-filter: blur(12px);
    }

    .spell-card::before {
      position: absolute;
      top: 0;
      left: 18%;
      width: 64%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 86, 62, .8), transparent);
      content: "";
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #ffe5d4;
      font-size: .85rem;
      font-weight: 600;
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid rgba(255, 135, 95, .25);
      border-radius: 11px;
      outline: none;
      background: rgba(16, 5, 4, .76);
      color: #fff;
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    input::placeholder { color: #a18a80; }

    input:focus {
      border-color: rgba(255, 125, 86, .8);
      box-shadow: 0 0 0 3px rgba(255, 86, 62, .16);
    }

    button {
      display: flex;
      width: 100%;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(105deg, #ff6845, #bd2027);
      box-shadow: 0 8px 26px rgba(202, 37, 26, .32);
      color: #fff5eb;
      cursor: pointer;
      font: inherit;
      font-size: .96rem;
      font-weight: 750;
      transition: filter .2s, transform .2s, opacity .2s;
    }

    button:hover:not(:disabled) { filter: brightness(1.09); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .72; }

    .hint {
      margin: 13px 0 0;
      color: #b69a8e;
      font-size: .75rem;
      text-align: center;
    }

    .stage {
      min-height: 224px;
      display: grid;
      place-items: center;
      margin-top: 20px;
      text-align: center;
    }

    .crystal {
      position: relative;
      display: grid;
      width: 128px;
      height: 128px;
      place-items: center;
      margin: 0 auto 17px;
      border: 1px solid rgba(255, 107, 71, .28);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 82, 50, .18), rgba(255, 111, 58, .025) 66%, transparent 68%);
      color: #ffc078;
      font-size: 2rem;
    }

    .crystal::before,
    .crystal::after {
      position: absolute;
      border: 1px solid rgba(255, 117, 69, .2);
      border-radius: 50%;
      content: "";
      inset: -10px;
    }

    .crystal::after {
      border-color: rgba(255, 186, 117, .14);
      inset: -21px;
    }

    .stage-copy {
      min-height: 52px;
      margin: 0;
      color: #f0d7c9;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .stage-copy strong { color: #fff; }
    .result { display: none; }
    .result .crystal { color: #ffd18b; }
    .result-title {
      margin: 0 0 8px;
      color: #ffab73;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.55rem;
      font-weight: 500;
    }

    .result p:last-child {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .stage.is-loading .crystal { animation: glow 1s ease-in-out infinite alternate; }
    .stage.is-loading .crystal::before { animation: spin 4s linear infinite; }
    .stage.is-loading .crystal::after { animation: spin 7s linear infinite reverse; }
    .stage.is-loading .spark { animation: sparkle .8s ease-in-out infinite alternate; }
    .stage.is-done .ritual { display: none; }
    .stage.is-done .result { display: block; animation: appear .7s ease-out both; }
    .stage.is-done .crystal { animation: success-pop .65s cubic-bezier(.2, .8, .2, 1) both; }

    .footer {
      color: #c0a08f;
      font-size: .75rem;
      text-align: center;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow {
      from { box-shadow: 0 0 12px rgba(255, 86, 62, .1); }
      to { box-shadow: 0 0 34px rgba(255, 111, 58, .34); }
    }
    @keyframes sparkle {
      from { transform: scale(.85); opacity: .55; }
      to { transform: scale(1.18); opacity: 1; }
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes success-pop {
      0% { transform: scale(.7); }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @media (max-width: 480px) {
      .page { padding: 22px 16px 18px; }
      .spell-card { margin-top: 30px; padding: 22px 18px; }
      .stage { min-height: 205px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    .page {
      width: 100%;
      justify-content: center;
      padding: 28px 20px;
    }

    main {
      width: min(100%, 420px);
      flex: 0 0 auto;
      align-items: center;
      padding: 0;
    }

    .intro { width: 100%; }

    .title-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 3vw, 18px);
    }

    h1 {
      color: #fff3e8;
      font-family: Impact, "Arial Black", fantasy;
      font-size: clamp(3.5rem, 14vw, 6rem);
      font-weight: 900;
      letter-spacing: .12em;
      text-indent: .12em;
      text-shadow:
        2px 2px 0 #57050b,
        -1px -1px 0 #57050b,
        0 4px 16px rgba(0, 0, 0, .9),
        0 0 35px rgba(169, 0, 12, .72);
    }

    h1 span { color: inherit; font-style: normal; }

    .title-skull {
      color: #ff493b;
      font-size: clamp(1.15rem, 5vw, 2rem);
      filter: drop-shadow(0 0 12px rgba(190, 0, 15, .75));
      animation: skull-flicker 3.2s ease-in-out infinite;
    }

    .title-skull:last-child { animation-delay: 1.2s; }

    @keyframes skull-flicker {
      0%, 100% { opacity: .8; transform: translateY(0) rotate(-8deg); }
      50% { opacity: 1; transform: translateY(-4px) rotate(8deg); }
    }

    .star-wrap {
      position: relative;
      width: min(76vw, 260px);
      aspect-ratio: 1;
      margin: 8px auto 16px;
    }

    .star-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .star-wrap.is-spinning .star-image {
      animation: star-roll 8s linear both;
    }

    @keyframes star-roll {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(180deg); }
      50% { transform: rotate(720deg); }
      75% { transform: rotate(1980deg); }
      87.5% { transform: rotate(3060deg); }
      100% { transform: rotate(6660deg); }
    }

    .spell-card {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    .spell-card::before { display: none; }

    input {
      border-color: rgba(255, 135, 95, .48);
      background: rgba(16, 5, 4, .82);
      text-align: center;
    }

    button {
      min-height: 58px;
      margin-top: 12px;
      font-size: 1rem;
      letter-spacing: .1em;
    }

    button:disabled { opacity: 1; }

    .success-popup {
      width: min(90vw, 390px);
      padding: 34px 26px 28px;
      border: 1px solid rgba(255, 48, 34, .68);
      border-radius: 4px;
      background:
        radial-gradient(ellipse at 50% 0, rgba(113, 0, 9, .34), transparent 70%),
        #090405;
      box-shadow: 0 0 60px rgba(177, 0, 17, .45), inset 0 0 30px rgba(80, 0, 6, .22);
      color: #f5e8e2;
      text-align: center;
    }

    .success-popup::backdrop {
      background: rgba(0, 0, 0, .82);
      backdrop-filter: blur(5px);
    }

    .popup-skull {
      margin: 0 0 12px;
      color: #ff3b32;
      font-size: 3.4rem;
      filter: drop-shadow(0 0 18px rgba(207, 0, 13, .8));
    }

    .popup-title {
      margin: 0;
      color: #ff4a3a;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      letter-spacing: .035em;
      text-shadow: 0 0 20px rgba(190, 0, 15, .5);
    }

    .popup-message {
      margin: 12px 0 0;
      color: #f5e8e2;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .popup-close {
      min-height: 46px;
      margin-top: 24px;
      background: linear-gradient(105deg, #831018, #4a080c);
      box-shadow: 0 0 22px rgba(174, 0, 17, .22);
      font-size: .85rem;
    }

    @media (max-width: 480px) {
      main { width: min(100%, 360px); }
      .page { padding: 20px 18px; }
      .star-wrap { margin: 4px auto 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .star-wrap.is-spinning .star-image { animation-duration: 8s !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="title-lockup">
          <span class="title-skull" aria-hidden="true">💀</span>
          <h1 id="page-title">JANDA</h1>
          <span class="title-skull" aria-hidden="true">💀</span>
        </div>
      </section>

      <div id="star-wrap" class="star-wrap">
        <img class="star-image" src="assets/janda-star-transparent.png" alt="">
      </div>

      <section class="spell-card" aria-label="Janda">
        <form id="spell-form">
          <input id="name" name="name" type="text" maxlength="40" placeholder="ENTER A NAME" aria-label="Enter a name" autocomplete="name" required>
          <button id="cast-button" type="submit">PUT JANDA</button>
        </form>
      </section>
    </main>
  </div>

  <dialog id="success-popup" class="success-popup" aria-labelledby="popup-title">
    <p class="popup-skull" aria-hidden="true">💀</p>
    <h2 id="popup-title" class="popup-title">Janda successful</h2>
    <p id="popup-message" class="popup-message"></p>
    <button id="popup-close" class="popup-close" type="button">CLOSE</button>
  </dialog>

  <audio id="ritual-audio" src="assets/janda-ritual.mp3" preload="auto"></audio>

  <script>
    const form = document.querySelector("#spell-form");
    const button = document.querySelector("#cast-button");
    const starWrap = document.querySelector("#star-wrap");
    const nameInput = document.querySelector("#name");
    const ritualAudio = document.querySelector("#ritual-audio");
    const successPopup = document.querySelector("#success-popup");
    const popupMessage = document.querySelector("#popup-message");
    const popupClose = document.querySelector("#popup-close");
    let spinTimer;

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (button.disabled) return;
      window.clearTimeout(spinTimer);
      starWrap.classList.remove("is-spinning");
      void starWrap.offsetWidth;
      starWrap.classList.add("is-spinning");
      popupMessage.textContent = nameInput.value.trim() + " GONE!!!!!!";
      button.disabled = true;
      ritualAudio.currentTime = 0;
      const playback = ritualAudio.play();
      if (playback) {
        playback.catch((error) => {
          console.error("Could not play the Janda audio.", error);
        });
      }
      spinTimer = window.setTimeout(() => {
        starWrap.classList.remove("is-spinning");
        button.disabled = false;
        successPopup.showModal();
        popupClose.focus();
      }, 8000);
    });

    popupClose.addEventListener("click", () => successPopup.close());
  </script>
</body>
</html>
